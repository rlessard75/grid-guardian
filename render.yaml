services:
  - type: web
    name: grid-guardian
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd dashboard/server && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
